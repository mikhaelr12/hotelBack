<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up - Tripsio</title>
    <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
<header>
    <div class="header-container">
        <h1><a href="/index" class="main-page-button">Tripsio</a></h1>
        <nav id="nav-links">
            <ul>
            </ul>
        </nav>
    </div>
</header>
<div class="container">
    <p id="containerTitle">Sign up</p>
    <form id="registerForm">
        <input type="text" id="username" name="username" placeholder="Username" required>
        <input type="email" id="email" name="email" placeholder="Email" required>
        <input type="password" id="password" name="password" placeholder="Password" required>
        <input type="number" id="phoneNumber" name="phoneNumber" placeholder="Phone number">
        <button type="submit">Sign up</button>
    </form>
    <p>Already have an account? <a href="/login">Log in</a></p>
</div>

<script src="/js/regService.js"></script>
<script src="/js/navbarService.js"></script>
</body>
</html>
